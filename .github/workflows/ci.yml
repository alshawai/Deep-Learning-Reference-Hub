name: CI

# origin exists, so this runs on push — and it is the only place the framework
# parity tracks can execute at all, since torch and tensorflow are absent from
# the authoring environment. A parity test that is skipped for a missing
# dependency must fail this job, never pass it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  hub:
    name: Docs, style, NumPy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,docs]"
          # execute: true in mkdocs.yml runs each tutorial notebook at build
          # time, which needs a discoverable kernel. pip installs ipykernel but
          # does not register a kernelspec; --sys-prefix puts one inside this
          # job's environment without touching a shared user directory.
          python -m ipykernel install --sys-prefix

      # These two cover the Markdown the site build does not: README,
      # CONTRIBUTING, and anything not yet filed into docs/. The strict build
      # below covers the rest, so between them no published page goes unchecked.
      - name: Links resolve outside the site
        run: python tools/hubcheck.py links

      - name: Anchors resolve outside the site
        run: python tools/hubcheck.py anchors

      - name: Prose Python compiles
        run: python tools/hubcheck.py fences

      - name: README matches the tree
        run: python tools/hubcheck.py readme

      # --strict promotes the validation warnings configured in mkdocs.yml to
      # errors, which is what makes a broken cross-reference or a page missing
      # from the nav fail this job rather than ship. It is also what checks the
      # links and anchors inside docs/, which the two steps above leave to it.
      - name: Site builds
        run: mkdocs build --strict

      - name: Format
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Tests
        run: |
          if [ -d tests ]; then python -m pytest -q; else echo "no tests yet"; fi

  parity:
    name: Cross-framework parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install frameworks
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install tensorflow-cpu

      # -p no:randomly and --strict-markers keep a skipped parity test from
      # reading as a pass. If a parity test cannot run, this job fails.
      - name: Parity tests
        run: |
          if ls tests/*parity*.py >/dev/null 2>&1; then
            python -m pytest tests -k parity -q -rs --strict-markers
          else
            echo "no parity tests yet"
          fi

  framework-notebooks:
    name: Framework tutorial notebooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,docs]"
          # A framework tutorial notebook imports torch, which the docs job does
          # not install; the CPU wheel comes by index for the same reason the
          # parity job installs it that way -- plain torch is the CUDA build.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # These notebooks execute here rather than in the docs build, and
          # nbconvert --execute needs a discoverable kernel just as the hub job
          # does; --sys-prefix registers one inside this job's environment.
          python -m ipykernel install --sys-prefix

      # The docs `hub` job renders these notebooks from their committed outputs
      # (execute_ignore in mkdocs.yml); this job runs each one end to end so a
      # cell error or a drifted output fails CI rather than shipping. The guard
      # keeps the job green until the first framework notebook exists, the same
      # shape the parity job uses for its tests.
      - name: Execute framework notebooks
        run: |
          if ls docs/tutorials/03-language-modeling-and-sampling.ipynb >/dev/null 2>&1; then
            jupyter nbconvert --to notebook --execute --stdout docs/tutorials/03-language-modeling-and-sampling.ipynb >/dev/null
          else
            echo "no framework notebooks yet"
          fi

  release-hygiene:
    name: Version, tag, and changelog agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Full history and tags: releasecheck compares __version__ against the
        # latest release tag and scans the commits since it, neither of which a
        # shallow clone carries.
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Version, tag, and changelog agree
        run: python tools/releasecheck.py
