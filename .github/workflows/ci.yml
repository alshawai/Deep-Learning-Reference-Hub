name: CI

# origin exists, so this runs on push — and it is the only place the framework
# parity tracks can execute at all, since torch and tensorflow are absent from
# the authoring environment. A parity test that is skipped for a missing
# dependency must fail this job, never pass it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  hub:
    name: Docs, style, NumPy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Links resolve
        run: python tools/hubcheck.py links

      - name: Anchors resolve
        run: python tools/hubcheck.py anchors

      - name: Prose Python compiles
        run: python tools/hubcheck.py fences

      - name: README matches the tree
        run: python tools/hubcheck.py readme

      - name: Format
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      # Walks both trees while the migration is underway: modules leave
      # `code-examples` for `src` one commit at a time, and `code-examples`
      # stops existing entirely once the last one moves. Neither tree is
      # required to be present, so this step needs no edit as they trade places.
      - name: Imports resolve
        run: |
          find src code-examples -name '*.py' -not -path '*__pycache__*' -print0 2>/dev/null \
            | xargs -0 -r -I{} python -c "import importlib.util,sys;s=importlib.util.spec_from_file_location('m','{}');m=importlib.util.module_from_spec(s);s.loader.exec_module(m)"

      - name: Tests
        run: |
          if [ -d tests ]; then python -m pytest -q; else echo "no tests yet"; fi

  parity:
    name: Cross-framework parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install frameworks
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install tensorflow-cpu

      # -p no:randomly and --strict-markers keep a skipped parity test from
      # reading as a pass. If a parity test cannot run, this job fails.
      - name: Parity tests
        run: |
          if ls tests/*parity*.py >/dev/null 2>&1; then
            python -m pytest tests -k parity -q -rs --strict-markers
          else
            echo "no parity tests yet"
          fi
