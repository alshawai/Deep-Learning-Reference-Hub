site_name: Deep Learning Reference Hub
site_description: From-scratch implementations of core deep learning methods, written to be read
site_url: https://alshawai.github.io/Deep-Learning-Reference-Hub/
repo_url: https://github.com/alshawai/Deep-Learning-Reference-Hub
repo_name: Deep-Learning-Reference-Hub
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    # The four quadrants are peers, not a hierarchy, and tabs are the one
    # navigation style that shows them that way.
    - navigation.tabs
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  # Math, extracted before any other processing so that Markdown never sees a
  # subscript underscore as emphasis. `generic: true` hands off to MathJax
  # rather than pre-rendering, which is what lets `\begin{align}` work.
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  # Exact version: documentation rendering must not change without a repository
  # change, and a moving `@3` URL would execute mutable third-party JavaScript.
  - https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js

plugins:
  # `search` is on by default, but naming any plugin replaces that default
  # rather than adding to it, so it has to be listed again here.
  - search
  # The API reference is generated from the docstrings the house style already
  # requires, which is what keeps that section true without anyone maintaining
  # it. A hand-written signature is the first documentation to go stale.
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            heading_level: 2
            members_order: source
            separate_signature: true
            show_signature_annotations: true

# This block is why the build is a link checker. Every one of these is a warning
# by default, and `--strict` promotes warnings to errors -- so the settings here
# plus that flag are what turn a broken cross-reference into a failed build.
# `anchors` is the one worth naming: without it a link to a heading that no
# longer exists resolves to the page and passes silently.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Tutorials: tutorials/index.md
  - How-to guides:
      - how-to/index.md
      - Choose an optimizer: how-to/choose-an-optimizer.md
      - Run a gradient check: how-to/run-a-gradient-check.md
      - Tune a learning rate: how-to/tune-learning-rate.md
      - Run a hyperparameter search: how-to/run-hyperparameter-search.md
  - Reference:
      - reference/index.md
      - Network shapes and dimensions: reference/network-shapes-and-dimensions.md
      - Activation functions: reference/activation-functions.md
      - Parameter update rule: reference/parameter-update-rule.md
      - Optimizer update rules: reference/optimizer-update-rules.md
      - Learning-rate schedules: reference/learning-rate-schedules.md
      - Parameter initialization: reference/parameter-initialization.md
      - Regularization: reference/regularization.md
      - Gradient checking: reference/gradient-checking.md
      - Hyperparameter search methods: reference/hyperparameter-search-methods.md
      - Deep learning resources: reference/resources.md
      - API:
          - Optimizers: reference/api/optimizers.md
          - Tuning: reference/api/tuning.md
          - Neural networks: reference/api/nn.md
          - Training techniques: reference/api/training.md
  - Explanation:
      - explanation/index.md
      - Forward and backward propagation: explanation/forward-and-backward-propagation.md
      - Matrix calculus for neural networks: explanation/matrix-calculus-for-neural-networks.md
      - Optimization algorithms: explanation/optimization-algorithms.md
      - Parameter initialization: explanation/parameter-initialization.md
      - Regularization: explanation/regularization.md
      - Gradient checking: explanation/gradient-checking.md
      - Hyperparameter tuning landscape: explanation/hyperparameter-tuning-landscape.md
